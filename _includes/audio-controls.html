<style>
  :root {
    --gold: #d97706;
    --gold2: #b45309;
    --pbr: #e2e8f0;
    --bg-card: #ffffff;
    --text-muted: #64748b;
  }

  .audio-bar-wrapper {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 600px;
    height: 48px;
    background: var(--bg-card);
    border: 1px solid var(--pbr);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    z-index: 9999;
    box-sizing: border-box;
  }

  .audio-btn {
    flex: 1 1 0;
    height: 100%;
    background: transparent;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--gold2);
    cursor: pointer;
    transition: all 0.2s ease;
    outline: none;
    font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border-radius: 8px;
    padding: 0 4px;
  }

  .audio-btn:hover {
    color: var(--gold);
    background: rgba(217, 119, 6, 0.06);
  }

  .audio-btn:active {
    transform: scale(0.95);
  }

  .audio-btn.muted {
    color: #dc2626;
  }

  .audio-btn .icon-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .audio-btn .icon-wrap svg {
    width: 18px;
    height: 18px;
  }

  .audio-btn.muted .icon-wrap::after {
    content: '';
    position: absolute;
    top: 50%;
    left: -3px;
    right: -3px;
    height: 2px;
    background: #dc2626;
    transform: translateY(-50%) rotate(45deg);
    border-radius: 2px;
  }

  .voice-menu-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(340px, calc(100vw - 32px));
    background: var(--bg-card);
    border: 2px solid var(--gold);
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
    z-index: 10000;
    padding: 16px;
    font-family: 'Rajdhani', sans-serif;
    color: var(--gold2);
    box-sizing: border-box;
  }

  .voice-menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--pbr);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .voice-menu-header span {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 1px;
    color: var(--gold);
  }

  .close-voice-btn {
    background: none;
    border: none;
    font-size: 1.4rem;
    color: var(--gold2);
    cursor: pointer;
    line-height: 1;
    transition: color 0.2s;
  }

  .close-voice-btn:hover {
    color: var(--gold);
  }

  .voice-players-list {
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .voice-player-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--pbr);
    background: #fdfdfd;
    transition: all 0.2s ease;
  }

  .voice-player-item:hover {
    background: #f8fafc;
    border-color: var(--gold);
  }

  .voice-player-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .voice-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .voice-player-name {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--gold2);
    word-break: break-all;
  }

  .voice-mute-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
    color: var(--gold2);
  }

  .voice-mute-btn svg {
    width: 16px;
    height: 16px;
  }

  .voice-mute-btn:hover {
    background: #f1f5f9;
    color: var(--gold);
  }

  .voice-mute-btn.muted {
    color: #dc2626;
    background: #fee2e2;
  }

  @media (max-width: 480px) {
    .audio-bar-wrapper {
      height: 44px;
      padding: 0 4px;
      bottom: 8px;
    }
    .audio-btn {
      font-size: 0.75rem;
      gap: 4px;
    }
    .audio-btn .icon-wrap svg {
      width: 16px;
      height: 16px;
    }
  }
</style>

<div class="audio-bar-wrapper" id="audio-bar-wrapper">
  <button class="audio-btn" id="btn-bgm" onclick="window.toggleBGM()">
    <span class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </span>
    <span>MSC</span>
  </button>
  <button class="audio-btn" id="btn-sfx" onclick="window.toggleSFX()">
    <span class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </span>
    <span>SFX</span>
  </button>
  <button class="audio-btn muted" id="btn-mic" onclick="window.toggleMic()">
    <span class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    </span>
    <span>MIC</span>
  </button>
  <button class="audio-btn" id="btn-speaker" onclick="window.toggleVoiceMenu()">
    <span class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><path d="M21 14a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h3z"/><path d="M3 14a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-1a2 2 0 0 0-2-2H3z"/></svg>
    </span>
    <span>SPKR</span>
  </button>
</div>

<div class="voice-menu-overlay" id="voice-menu-overlay" style="display: none;">
  <div class="voice-menu-header">
    <span>SPEAKERS</span>
    <button class="close-voice-btn" onclick="window.toggleVoiceMenu()">&times;</button>
  </div>
  <div class="voice-players-list" id="voice-players-list"></div>
</div>

<script>
  window.isBgmEnabled = true;
  window.isSfxEnabled = true;
  window.isMicEnabled = false;
  window.lastVoicePlayers = [];
  window.lastVoiceMyUid = '';

  let myLocalStream = null;
  let signalSocket = null;
  let signalReconnectTimer = null;
  const peerConnections = {};
  const remoteAudioElements = {};
  const localMutedPlayers = {};
  const voicePlayerCache = {};
  const iceCandidatesQueue = {};
  const COLOR_HEX = { red: '#c62828', green: '#2e7d32', yellow: '#f9a825', blue: '#1565c0' };

  const SVG_SPEAKER_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
  const SVG_SPEAKER_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';

  function getBaseUrl() {
    return (window.BACKEND_URL || window.RTDB_URL || "").replace(/\/$/, "");
  }

  function getWsBaseUrl() {
    const base = getBaseUrl();
    return base ? (base.startsWith("https") ? "wss://" : "ws://") + base.replace(/^https?:\/\//, "") : "";
  }

  function safeVoiceName(player, fallback) {
    const raw = player && (player.name || player.displayName || player.username || player.nick);
    const name = String(raw || '').trim();
    if (name) return name;
    const uid = String((player && player.uid) || fallback || '').trim();
    return uid ? 'Player ' + uid.slice(0, 4) : 'Player';
  }

  function getVoiceUid(player) {
    return String((player && player.uid) || '').trim();
  }

  async function ensureMicStream() {
    if (myLocalStream) return myLocalStream;
    try {
      myLocalStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
      const track = myLocalStream.getAudioTracks()[0];
      if (track) track.enabled = window.isMicEnabled;
    } catch (err) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const ctx = new AudioContext();
      const dest = ctx.createMediaStreamDestination();
      myLocalStream = dest.stream;
      window.isMicEnabled = false;
      const btn = document.getElementById('btn-mic');
      if (btn) btn.classList.add('muted');
    }
    return myLocalStream;
  }

  async function sendSignal(toUid, signal) {
    const base = getBaseUrl();
    if (!base || !window.lastVoiceMyUid) return;
    try {
      await fetch(`${base}/signals/${toUid}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ from: window.lastVoiceMyUid, signal, time: Date.now() })
      });
    } catch (e) {}
  }

  function connectSignaling(uid) {
    const wsBase = getWsBaseUrl();
    if (!wsBase || !uid) return;
    if (signalSocket) {
      signalSocket.onclose = null;
      signalSocket.close();
    }

    signalSocket = new WebSocket(`${wsBase}/ws/signals/${uid}`);

    signalSocket.onmessage = async (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.event === "connected" || !msg.data) return;
        const { from, signal } = msg.data;
        if (!from || !signal || from === window.lastVoiceMyUid) return;
        await handleIncomingSignal(from, signal);
      } catch (e) {}
    };

    signalSocket.onclose = () => {
      if (window.lastVoiceMyUid) {
        signalReconnectTimer = setTimeout(() => connectSignaling(window.lastVoiceMyUid), 2000);
      }
    };

    signalSocket.onerror = () => {
      if (signalSocket) signalSocket.close();
    };
  }

  function getOrCreatePC(targetUid) {
    if (peerConnections[targetUid]) return peerConnections[targetUid];

    const pc = new RTCPeerConnection({
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    });

    if (myLocalStream) {
      myLocalStream.getTracks().forEach(track => pc.addTrack(track, myLocalStream));
    }

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        sendSignal(targetUid, { candidate: event.candidate });
      }
    };

    pc.ontrack = (event) => {
      const remoteStream = event.streams[0];
      if (!remoteAudioElements[targetUid]) {
        const audio = document.createElement('audio');
        audio.autoplay = true;
        audio.id = 'remote-audio-' + targetUid;
        audio.muted = !!localMutedPlayers[targetUid];
        document.body.appendChild(audio);
        remoteAudioElements[targetUid] = audio;
      }
      remoteAudioElements[targetUid].srcObject = remoteStream;
      remoteAudioElements[targetUid].play().catch(() => {});
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
        cleanupRemote(targetUid);
      }
    };

    peerConnections[targetUid] = pc;
    return pc;
  }

  async function handleIncomingSignal(fromUid, signal) {
    await ensureMicStream();
    const pc = getOrCreatePC(fromUid);

    if (signal.sdp) {
      await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
      if (signal.sdp.type === 'offer') {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await sendSignal(fromUid, { sdp: pc.localDescription });
      }
      if (iceCandidatesQueue[fromUid]) {
        for (const cand of iceCandidatesQueue[fromUid]) {
          try { await pc.addIceCandidate(cand); } catch (e) {}
        }
        delete iceCandidatesQueue[fromUid];
      }
    } else if (signal.candidate) {
      const candidate = new RTCIceCandidate(signal.candidate);
      if (pc.remoteDescription && pc.remoteDescription.type) {
        try { await pc.addIceCandidate(candidate); } catch (e) {}
      } else {
        if (!iceCandidatesQueue[fromUid]) iceCandidatesQueue[fromUid] = [];
        iceCandidatesQueue[fromUid].push(candidate);
      }
    }
  }

  window.toggleBGM = function () {
    window.isBgmEnabled = !window.isBgmEnabled;
    const btn = document.getElementById('btn-bgm');
    if (btn) btn.classList.toggle('muted', !window.isBgmEnabled);
    const bgm = document.getElementById('bgm-snd');
    if (!bgm) return;
    if (!window.isBgmEnabled) {
      bgm.pause();
    } else if (document.getElementById('game-screen')?.classList.contains('active')) {
      bgm.play().catch(() => {});
    }
  };

  window.toggleSFX = function () {
    window.isSfxEnabled = !window.isSfxEnabled;
    const btn = document.getElementById('btn-sfx');
    if (btn) btn.classList.toggle('muted', !window.isSfxEnabled);
  };

  window.initVoiceChat = async function (myUid) {
    window.lastVoiceMyUid = String(myUid || '').trim();
    if (!window.lastVoiceMyUid) return;
    await ensureMicStream();
    connectSignaling(window.lastVoiceMyUid);
  };

  window.toggleMic = async function () {
    await ensureMicStream();
    if (!myLocalStream) return;
    window.isMicEnabled = !window.isMicEnabled;
    myLocalStream.getAudioTracks().forEach(track => (track.enabled = window.isMicEnabled));
    const btn = document.getElementById('btn-mic');
    if (btn) btn.classList.toggle('muted', !window.isMicEnabled);
    if (window.syncVoicePeers && window.lastVoicePlayers) {
      window.syncVoicePeers(window.lastVoicePlayers, window.lastVoiceMyUid);
    }
  };

  window.toggleVoiceMenu = function () {
    const overlay = document.getElementById('voice-menu-overlay');
    if (!overlay) return;
    const isHidden = overlay.style.display === 'none';
    overlay.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
      window.updateVoiceMenu();
    }
  };

  window.updateVoiceMenu = function () {
    const container = document.getElementById('voice-players-list');
    if (!container) return;
    container.innerHTML = '';
    const players = window.lastVoicePlayers || [];
    const myId = String(window.lastVoiceMyUid || '').trim();
    const otherPlayers = players.filter(p => p && getVoiceUid(p) && getVoiceUid(p) !== myId);

    if (otherPlayers.length === 0) {
      container.innerHTML = '<div style="text-align:center;color:#64748b;font-size:0.9rem;padding:12px;">No other players in room</div>';
      return;
    }

    otherPlayers.forEach(p => {
      const uid = getVoiceUid(p);
      const name = safeVoiceName(p, uid);
      const isMuted = !!localMutedPlayers[uid];
      const isOnline = p.isOnline !== false;
      const color = p.color || '';
      const colorDotStyle = color && COLOR_HEX[color] ? `background:${COLOR_HEX[color]}` : 'background:#64748b';

      const item = document.createElement('div');
      item.className = 'voice-player-item';

      const info = document.createElement('div');
      info.className = 'voice-player-info';

      const dot = document.createElement('div');
      dot.className = 'voice-dot';
      dot.style.cssText = colorDotStyle;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'voice-player-name';
      nameSpan.textContent = name + (!isOnline ? ' (Offline)' : '');
      if (!isOnline) nameSpan.style.color = '#94a3b8';

      info.appendChild(dot);
      info.appendChild(nameSpan);

      const muteBtn = document.createElement('button');
      muteBtn.id = 'btn-mute-' + uid;
      muteBtn.className = 'voice-mute-btn' + (isMuted ? ' muted' : '');
      muteBtn.onclick = () => window.togglePlayerMute(uid);
      muteBtn.innerHTML = isMuted ? SVG_SPEAKER_OFF : SVG_SPEAKER_ON;

      item.appendChild(info);
      item.appendChild(muteBtn);
      container.appendChild(item);
    });
  };

  window.togglePlayerMute = function (targetUid) {
    targetUid = String(targetUid || '').trim();
    if (!targetUid) return;
    localMutedPlayers[targetUid] = !localMutedPlayers[targetUid];
    if (remoteAudioElements[targetUid]) {
      remoteAudioElements[targetUid].muted = !!localMutedPlayers[targetUid];
    }
    window.updateVoiceMenu();
  };

  function cleanupRemote(targetUid) {
    targetUid = String(targetUid || '').trim();
    if (!targetUid) return;
    if (remoteAudioElements[targetUid]) {
      remoteAudioElements[targetUid].remove();
      delete remoteAudioElements[targetUid];
    }
    if (peerConnections[targetUid]) {
      try { peerConnections[targetUid].close(); } catch (e) {}
      delete peerConnections[targetUid];
    }
    delete iceCandidatesQueue[targetUid];
  }

  window.syncVoicePeers = async function (players, currentMyUid) {
    window.lastVoicePlayers = players;
    window.lastVoiceMyUid = String(currentMyUid || '').trim();
    const myId = window.lastVoiceMyUid;
    if (!myId) return;

    const onlinePlayers = (Array.isArray(players) ? players : []).filter(p => p && getVoiceUid(p) && getVoiceUid(p) !== myId);
    const activeUids = new Set(onlinePlayers.map(getVoiceUid));

    Object.keys(peerConnections).forEach(uid => {
      if (!activeUids.has(uid)) cleanupRemote(uid);
    });

    await ensureMicStream();

    for (const p of onlinePlayers) {
      const targetUid = getVoiceUid(p);
      voicePlayerCache[targetUid] = p;

      if (!peerConnections[targetUid] && myId < targetUid) {
        const pc = getOrCreatePC(targetUid);
        try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          await sendSignal(targetUid, { sdp: pc.localDescription });
        } catch (err) {}
      }
    }

    window.updateVoiceMenu();
  };

  window.closeVoiceChat = function () {
    Object.keys(peerConnections).forEach(cleanupRemote);
    if (signalReconnectTimer) {
      clearTimeout(signalReconnectTimer);
      signalReconnectTimer = null;
    }
    if (signalSocket) {
      signalSocket.onclose = null;
      try { signalSocket.close(); } catch (e) {}
      signalSocket = null;
    }
    if (myLocalStream) {
      myLocalStream.getTracks().forEach(track => track.stop());
    }
    Object.keys(remoteAudioElements).forEach(uid => {
      if (remoteAudioElements[uid]) remoteAudioElements[uid].remove();
      delete remoteAudioElements[uid];
    });
    Object.keys(voicePlayerCache).forEach(uid => delete voicePlayerCache[uid]);
    myLocalStream = null;
    window.isMicEnabled = false;
    const btn = document.getElementById('btn-mic');
    if (btn) btn.classList.add('muted');
  };
</script>
