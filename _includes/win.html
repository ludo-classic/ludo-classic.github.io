<style>
  :root {
    --gold: #d97706;
    --gold2: #b45309;
    --pb: #ffffff;
    --pbr: #e2e8f0;
    --text-muted: #64748b;
  }

  @keyframes popIn {
    0% { transform: scale(0.75); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  #win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.88);
    z-index: 9998;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    overflow: hidden;
  }
  #win-overlay.active { display: flex; }

  .win-card {
    background: rgba(24, 24, 27, 0.75);
    border: 1px solid rgba(217, 119, 6, 0.4);
    border-radius: 24px;
    padding: 36px 24px;
    box-shadow: 0 0 40px rgba(217, 119, 6, 0.25), inset 0 0 20px rgba(217, 119, 6, 0.08);
    backdrop-filter: blur(12px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 2;
    position: relative;
    width: 90%;
    max-width: 400px;
  }

  #confetti-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    top: -20px;
    width: 10px;
    height: 10px;
    opacity: 0;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(105vh) rotate(720deg); }
  }

  .win-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.2rem, 5vw, 2.2rem);
    color: var(--gold);
    text-align: center;
    text-shadow: 0 0 20px rgba(217,119,6,.25);
    letter-spacing: 3px;
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    0% { text-shadow: 0 0 10px rgba(217,119,6,.2); }
    100% { text-shadow: 0 0 26px rgba(217,119,6,.6), 0 0 8px rgba(217,119,6,.3); }
  }

  .win-emoji {
    font-size: 72px;
    animation: bounce .6s ease-in-out infinite alternate;
    line-height: 1;
  }
  @keyframes bounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-12px); }
  }

  .win-sub {
    color: #fcd34d;
    font-size: 0.92rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .win-back-btn {
    margin-top: 8px;
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--gold2), var(--gold));
    color: #ffffff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(217,119,6,.25);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .win-back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(217,119,6,.35);
  }

  #exit-confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 9999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    backdrop-filter: blur(4px);
  }
  #exit-confirm-overlay.active { display: flex; }

  .confirm-card {
    background: var(--pb);
    border: 1px solid var(--pbr);
    border-radius: 18px;
    padding: 26px 22px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 16px 36px rgba(0,0,0,.15);
    text-align: center;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .confirm-title {
    color: #dc2626;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 10px;
    font-family: 'Cinzel Decorative', serif;
  }

  .confirm-text {
    color: #475569;
    font-size: 0.95rem;
    margin-bottom: 22px;
    line-height: 1.45;
    font-weight: 600;
  }

  .confirm-btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .btn-cancel {
    flex: 1;
    background: rgba(0,0,0,.04);
    border: 1px solid var(--pbr);
    border-radius: 8px;
    color: #334155;
    padding: 11px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-cancel:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn-confirm-exit {
    flex: 1;
    background: transparent;
    border: 1px solid #dc2626;
    border-radius: 8px;
    color: #dc2626;
    padding: 11px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-confirm-exit:hover {
    background: rgba(220,38,38,.08);
    box-shadow: 0 4px 12px rgba(220,38,38,.12);
  }
</style>

<div id="win-overlay">
  <div id="confetti-container"></div>
  <div class="win-card">
    <div class="win-emoji">🏆</div>
    <div class="win-title" id="win-title">PLAYER WINS!</div>
    <div class="win-sub">Congratulations!</div>
    <button class="win-back-btn" onclick="exitToLobby()">Back to Lobby</button>
  </div>
</div>

<div id="exit-confirm-overlay">
  <div class="confirm-card">
    <div class="confirm-title">⚠️ Exit Game?</div>
    <div class="confirm-text">Are you sure you want to leave the room? If you are the host, the room might be closed.</div>
    <div class="confirm-btn-row">
      <button class="btn-cancel" onclick="closeExitConfirm()">Cancel</button>
      <button class="btn-confirm-exit" onclick="confirmExit()">Yes, Leave</button>
    </div>
  </div>
</div>
